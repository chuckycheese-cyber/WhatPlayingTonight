name: Nightly update
on:
  schedule:
    - cron: '0 5 * * *'   # midnight New York (EST)
    - cron: '0 4 * * *'   # midnight New York (EDT)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.js
        env: { CI: 'true' }
      - name: Commit changes
        run: |
          git config user.name "wpt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Nightly update" && git push)
